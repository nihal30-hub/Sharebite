<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – ShareBite</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navbar Minimal -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-seedling"></i>
        Share<span>Bite</span>
      </a>
      <div class="nav-actions">
        <span style="font-size:0.9rem; color:var(--text-muted);">Already registered?</span>
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Register Form Container -->
  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <div class="auth-logo-icon">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2>Create an Account</h2>
        <p>Join ShareBite to share meals and support community welfare</p>
      </div>

      <div id="authAlert" style="display:none;" class="alert alert-danger"></div>

      <form id="registerForm" novalidate>
        <!-- Role Selection Cards -->
        <div class="form-group">
          <label class="form-label">I want to join as: <span class="required">*</span></label>
          <div class="role-selection-grid">
            <label class="role-radio-card" id="donorCard">
              <input type="radio" name="userRole" value="donor" checked>
              <div class="role-icon"><i class="fa-solid fa-hand-holding-heart"></i></div>
              <span class="role-name">Food Donor</span>
              <span class="role-desc">Restaurants, caterers, hostellers, households</span>
            </label>

            <label class="role-radio-card" id="receiverCard">
              <input type="radio" name="userRole" value="receiver">
              <div class="role-icon"><i class="fa-solid fa-utensils"></i></div>
              <span class="role-name">Food Receiver</span>
              <span class="role-desc">Individuals, volunteers, NGO reps, students</span>
            </label>
          </div>
        </div>

        <!-- Full Name -->
        <div class="form-group">
          <label for="regFullName" class="form-label">Full Name <span class="required">*</span></label>
          <div class="input-group">
            <i class="fa-solid fa-user input-icon"></i>
            <input 
              type="text" 
              id="regFullName" 
              class="form-control" 
              placeholder="e.g. John Doe / Green Dine Mess" 
              required
            >
          </div>
          <div id="nameError" class="form-error" style="display:none;"></div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address <span class="required">*</span></label>
          <div class="input-group">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input 
              type="email" 
              id="regEmail" 
              class="form-control" 
              placeholder="you@example.com" 
              required
            >
          </div>
          <div id="emailError" class="form-error" style="display:none;"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="regPassword" class="form-label">Password <span class="required">*</span></label>
          <div class="input-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input 
              type="password" 
              id="regPassword" 
              class="form-control" 
              placeholder="Minimum 6 characters" 
              required
            >
          </div>
          <div id="passwordError" class="form-error" style="display:none;"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Confirm Password <span class="required">*</span></label>
          <div class="input-group">
            <i class="fa-solid fa-shield-check input-icon"></i>
            <input 
              type="password" 
              id="regConfirmPassword" 
              class="form-control" 
              placeholder="Re-enter password" 
              required
            >
          </div>
          <div id="confirmPasswordError" class="form-error" style="display:none;"></div>
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem;">
          <i class="fa-solid fa-user-check"></i> Register Account
        </button>
      </form>

      <div style="margin-top:1.8rem; padding-top:1.5rem; border-top:1px solid var(--cream-border); text-align:center;">
        <p style="font-size:0.9rem; color:var(--text-muted);">
          Already have an account? <a href="login.html" style="font-weight:700; color:var(--primary-forest);">Sign in</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Register Logic Script -->
  <script type="module">
    import { registerUser } from "./js/auth.js";

    const form = document.getElementById("registerForm");
    const nameInput = document.getElementById("regFullName");
    const emailInput = document.getElementById("regEmail");
    const passwordInput = document.getElementById("regPassword");
    const confirmPasswordInput = document.getElementById("regConfirmPassword");
    const submitBtn = document.getElementById("registerSubmitBtn");
    const alertBox = document.getElementById("authAlert");

    const donorCard = document.getElementById("donorCard");
    const receiverCard = document.getElementById("receiverCard");
    const roleRadios = document.querySelectorAll("input[name='userRole']");

    // Pre-select role if specified in query string e.g. ?role=receiver
    const urlParams = new URLSearchParams(window.location.search);
    const preRole = urlParams.get('role');
    if (preRole === 'receiver') {
      const radio = document.querySelector("input[name='userRole'][value='receiver']");
      if (radio) radio.checked = true;
    }

    // Role card visual highlight sync
    function updateRoleCards() {
      roleRadios.forEach(radio => {
        const card = radio.closest(".role-radio-card");
        if (radio.checked) {
          card.classList.add("selected");
        } else {
          card.classList.remove("selected");
        }
      });
    }
    updateRoleCards();
    roleRadios.forEach(radio => radio.addEventListener("change", updateRoleCards));

    // Form submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      clearErrors();

      const fullName = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const selectedRole = document.querySelector("input[name='userRole']:checked")?.value || "donor";

      let hasError = false;

      if (!fullName) {
        showError("nameError", "Please enter your full name.");
        hasError = true;
      }

      if (!email || !email.includes("@")) {
        showError("emailError", "Please enter a valid email address.");
        hasError = true;
      }

      if (!password || password.length < 6) {
        showError("passwordError", "Password must be at least 6 characters.");
        hasError = true;
      }

      if (password !== confirmPassword) {
        showError("confirmPasswordError", "Passwords do not match.");
        hasError = true;
      }

      if (hasError) return;

      const origText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner"></span> Creating Account...`;

      const result = await registerUser(fullName, email, password, selectedRole);

      submitBtn.disabled = false;
      submitBtn.innerHTML = origText;

      if (result.success) {
        // Redirect according to selected role
        setTimeout(() => {
          if (selectedRole === 'donor') {
            window.location.href = "donor-dashboard.html";
          } else {
            window.location.href = "receiver-dashboard.html";
          }
        }, 1000);
      } else {
        alertBox.textContent = result.error;
        alertBox.style.display = "flex";
      }
    });

    function showError(id, msg) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = msg;
        el.style.display = "block";
      }
    }

    function clearErrors() {
      document.querySelectorAll(".form-error").forEach(el => el.style.display = "none");
    }
  </script>
</body>
</html>
